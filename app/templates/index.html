<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Cloud Architecture AI Assistant</title>
<link rel="stylesheet" href="/static/style.css">
</head>
<body>
<div class="container">
<header>
<h1>Google Cloud Architect Assistant</h1>
<p>Powered by Gemini 2.5 Flash on Vertex AI</p>
</header>
<main class="card">
<div class="form-group">
<label for="prompt">Ask an Architectural Question:</label>
<textarea id="prompt" placeholder="e.g., How do I secure a Cloud Run service using IAM least privilege?" rows="4"></textarea>
</div>
<button id="submit-btn" onclick="submitPrompt()">Generate Architecture Guidance</button>
<div id="loading" class="hidden">
<div class="spinner"></div>
<span>Analyzing cloud requirements...</span>
</div>
<div id="response-container" class="hidden">
<h3>Architectural Guidance:</h3>
<div id="response-text"></div>
</div>
<div id="error-container" class="hidden alert-danger">
<span id="error-text"></span>
</div>
</main>
</div>
<script src="/static/app.js"></script>
</body>
</html>
